<!DOCTYPE html><html><head><meta charset="utf-8"><style>

* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0B0D10; --surface:#14171C; --line:#262B32;
  --text:#F5F5F7; --text2:#8A8F98; --text3:#5A6068;
  --accent:#FF6B1A; --amber:#FFC24B; --danger:#FF453A;
}
body {
  width:1280px; height:2772px; background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  overflow:hidden; position:relative;
}
.pad { padding:0 72px; }
.brand { display:flex; align-items:center; gap:18px; }
.dot { width:22px; height:22px; border-radius:50%; background:var(--accent); }
.brand-name { font-size:26px; font-weight:700; letter-spacing:3px; }
.eyebrow { font-size:22px; font-weight:700; letter-spacing:5px; color:var(--text3); }
.muted { color:var(--text2); }
.dim { color:var(--text3); }
.num { font-variant-numeric: tabular-nums; letter-spacing:-2px; }

.header { position:absolute; top:140px; left:72px; right:72px; display:flex;
  justify-content:space-between; align-items:center; }
.nav { display:flex; gap:64px; font-size:28px; color:var(--text2); }
.status { position:absolute; top:430px; left:72px; }
.hero { position:absolute; top:600px; left:66px; display:flex; align-items:baseline; }
.hero .value { font-size:400px; font-weight:700; line-height:0.85; }
.hero .unit { font-size:104px; font-weight:700; color:var(--text2); margin-left:26px; }
.elapsed { position:absolute; top:1210px; left:66px; font-size:150px;
  font-weight:400; letter-spacing:2px; color:var(--text); }
.stats { position:absolute; top:1520px; left:72px; right:72px; display:flex; }
.stat { flex:1; }
.stat .k { font-size:22px; font-weight:700; letter-spacing:3px; color:var(--text3); }
.stat .v { font-size:64px; font-weight:700; color:var(--text2); margin-top:18px; }
.cta { position:absolute; left:72px; right:72px; bottom:190px; height:150px;
  border-radius:80px; background:var(--accent); display:flex;
  align-items:center; justify-content:center; font-size:46px; font-weight:700; color:#12100E; }
.hint { position:absolute; left:72px; bottom:120px; font-size:24px; color:var(--text3); }
.rail { position:absolute; left:72px; right:72px; bottom:78px; height:4px; background:var(--line); }
.rail i { display:block; width:120px; height:4px; background:var(--accent); }
</style></head><body>
<div class="header">
  <div class="brand"><span class="dot"></span><span class="brand-name">XINGJI</span></div>
  <div class="nav"><span>行程</span><span>设置</span><span>AI</span></div>
</div>
<div class="status eyebrow">NOT RECORDING</div>
<div class="hero num"><span class="value">0</span><span class="unit">米</span></div>
<div class="elapsed num">00:00</div>
<div class="stats">
  <div class="stat"><div class="k">均速</div><div class="v num">0.0</div></div>
  <div class="stat"><div class="k">最高</div><div class="v num">0.0</div></div>
  <div class="stat"><div class="k">点数</div><div class="v num">0</div></div>
</div>
<div class="cta">开始记录</div>
<div class="hint">离线：仅底图缓存，弱网可看部分区域</div>
<div class="rail"><i></i></div>
</body></html>
